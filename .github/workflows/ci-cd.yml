  deploy:

    runs-on: ubuntu-latest

    # needs: build-and-push

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install DigitalOcean CLI
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DO_ACCESS_TOKEN }}

    - name: Install kubectl
      run: |
        sudo apt-get update
        sudo apt-get install -y kubectl

    - name: Save DigitalOcean kubeconfig
      run: |
        doctl kubernetes cluster kubeconfig save ${{ secrets.DO_KUBERNETES_CLUSTER }}

    - name: Create RabbitMQ Secret
      env:
        RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
        RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER }}
        RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
      run: |
        chmod +x ./scripts/create-rabbitmq-secret.sh
        ./scripts/create-rabbitmq-secret.sh

    - name: Deploy to Kubernetes cluster
      run: |
        chmod +x ./scripts/deploy-k8s.sh
        ./scripts/deploy-k8s.sh
